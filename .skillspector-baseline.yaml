# SkillSpector baseline for the ZTorch vault (first-party, operator-authored offensive corpus).
# rules: accept categories INHERENT to an offensive-security skill vault (would be findings
# in a general-purpose skill; here they are the subject matter).
# fingerprints: EXACT, scanner-generated (v2 binds version+content); they cover the
# judgment-sensitive categories (prompt-injection, exfil, memory-poisoning, anti-refusal,
# script-fetching, unpinned deps) - edit the wording and they resurface for review.
# Regenerate per-skill after deliberate changes: skillspector baseline <dir> -o, then re-merge;
# sweep: bash scripts/skill-scan.sh
